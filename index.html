<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLOQ LARP</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06302f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#06302f;--bg2:#041f20;--card:#0a2a2a;--pill:#071a1b;--neon:#5cff3c;--g:#3ddc2a;--tx:#fff;--mut:#8fb0ad;--wh:#fff;--ink:#0e1b2b;--sub:#7d8aa0;--red:#ff2d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain;margin:0;background:var(--bg2);font-family:"Poppins","Segoe UI",Roboto,sans-serif;color:var(--tx)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 520px);position:relative;padding-bottom:110px;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:28px;color:var(--neon);letter-spacing:1px}
.logo small{font-size:10px;background:var(--neon);color:#042;border-radius:6px;padding:2px 6px;letter-spacing:.5px;align-self:flex-start;margin-top:4px}
.ic{display:flex;gap:6px}.ic button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative}
.ic svg,.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff3b3b}
.tot{padding:10px 20px 0}.tot .l{color:#cfe3e1;font-size:15px}
.tot .v{display:flex;align-items:center;justify-content:space-between}
.tot .v b{font-size:36px;font-weight:700;letter-spacing:-.5px}
.pf{color:var(--neon);font-weight:600;font-size:18px;margin-top:2px;display:flex;align-items:center;gap:8px}
.pf.neg{color:var(--red)}
.cd{margin:8px 20px 0;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}
.cd button{margin-left:auto;background:var(--pill);border:1px solid #1d5a4a;border-radius:999px;padding:6px 12px;color:var(--neon);font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.cd svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
.spin svg{animation:sp .8s linear}@keyframes sp{to{transform:rotate(360deg)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px 0}
.big{background:var(--pill);border-radius:999px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}
.big svg{width:26px;height:26px;stroke:var(--neon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:20px 12px 0}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#e6f2f0}
.quick i{width:60px;height:60px;border-radius:20px;background:#0f4a40;display:grid;place-items:center;color:var(--neon)}
.quick svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ban{margin:22px 20px 0;border-radius:22px;border:1px solid #14574a;min-height:150px;padding:18px;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 70%,#3fae8c55,transparent 55%),linear-gradient(120deg,#0b3a2c,#06241f)}
.ban .n{font-weight:800;color:var(--neon);font-size:15px}.ban h3{margin:8px 0 0;font-size:26px;line-height:1.15;color:#9dff52;max-width:60%}
.ban .gem{position:absolute;right:16px;bottom:14px;width:110px;height:110px;background:linear-gradient(135deg,#9be7d0aa,#1c5b57aa 60%,#0d3a3a);clip-path:polygon(50% 0,100% 35%,85% 100%,15% 100%,0 35%);opacity:.9}
.ban .gem2{position:absolute;right:30px;top:20px;width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#2a52ff,#10256e);display:grid;place-items:center;font-weight:800;font-style:italic;transform:rotate(-12deg);font-size:16px}
.ban p{position:absolute;left:18px;bottom:10px;margin:0;font-size:11px;color:#bfe;opacity:.85}
.wo{padding:22px 0 0}.wh{display:flex;justify-content:space-between;align-items:center;padding:0 20px}.wh b{font-size:26px;font-weight:600}.wh button{color:#a6f08a;font-size:15px}
.chs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 0;scrollbar-width:none}.chs::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}.chs button{flex:none;border:2px solid #fff;border-radius:999px;padding:8px 18px;font-size:15px;color:#fff}.chs button.on{background:#a6f08a;border-color:#a6f08a;color:#06302f;font-weight:600}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding:16px 20px 0;scrollbar-width:none}
.sl{flex:0 0 100%;scroll-snap-align:start;border-radius:22px;min-height:200px;padding:16px;position:relative;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 80% 80%,#1f6b4f66,transparent 55%),linear-gradient(120deg,#082c2a,#041a1b);border:1px solid #14574a}
.sl .br{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:#a6f08a}.sl h4{margin:10px 0 0;font-size:16px;line-height:1.3;max-width:66%;font-weight:600}
.sl .bg{display:flex;align-items:flex-end;gap:6px;margin-top:4px}.sl .bg span{font-size:66px;font-weight:800;line-height:1;background:linear-gradient(#e2ffd5,#7de05a);-webkit-background-clip:text;background-clip:text;color:transparent}.sl .bg small{font-size:20px;font-weight:700;padding-bottom:8px}
.sl .dt{display:inline-block;background:#a6f08a;color:#06302f;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.sl .tk{position:absolute;right:16px;top:44px;background:linear-gradient(135deg,#b6f79b,#5cd13c);color:#06302f;font-weight:800;font-size:15px;padding:10px 16px;border-radius:10px;transform:rotate(8deg);text-align:center;line-height:1.25}.sl .tk small{display:block;font-size:10px;font-weight:600}
.sl .gm{position:absolute;right:30px;bottom:24px;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#1f8a74,#0b3a3a);transform:rotate(-10deg);display:grid;place-items:center;font-size:34px}
.dots{display:flex;justify-content:center;gap:12px;padding:16px 0 0}.dots button{width:14px;height:14px;border-radius:50%;background:#9aa7a9;transition:.2s}.dots button.on{width:48px;border-radius:8px;background:#a6f08a}
.sheetw{background:var(--wh);color:var(--ink);border-radius:32px 32px 0 0;margin-top:26px;padding:16px 0 20px;min-height:340px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #eef1f5;margin:0 16px}
.tabs button{padding:12px;font-size:20px;font-weight:600;color:var(--sub);position:relative}
.tabs button.on{color:var(--ink)}.tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;border-radius:4px;background:#62ff4a}
.coin{display:flex;align-items:center;gap:14px;padding:16px 20px}
.cc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.coin .nm{flex:1}.coin .nm b{font-size:20px;display:block}.coin .nm span{color:var(--sub);font-size:16px}
.coin .pr{text-align:right}.coin .pr b{font-size:19px;display:block}.chg{font-size:16px;font-weight:600}.up{color:#12b34a}.dn{color:var(--red)}
.star{font-size:22px;color:#c3cbd8;padding:6px}.star.on{color:#f5b400}
.srch{margin:12px 20px 0;width:calc(100% - 40px);border:1.5px solid #dfe5ee;border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);background:#f6f8fb}
.empty{text-align:center;color:var(--sub);padding:34px 20px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));background:#fff;border-radius:28px;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 6px;box-shadow:0 10px 30px #0007;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.nav button.on{color:var(--ink);font-weight:700}.nav svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav .on svg{fill:currentColor}
.pg{padding:20px}.pg h2{margin:0 0 4px;font-size:24px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid #14574a;border-radius:20px;padding:16px;margin-top:14px}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #12403b}.tx:last-child{border:0}
.tx b{font-size:15px}.tx small{color:var(--mut);display:block;font-size:12px;margin-top:2px}.tx .a{text-align:right;font-weight:700}
.pos{color:var(--neon)}.neg{color:#ff5d7a}
.pill{display:inline-block;background:#0f4a40;color:var(--neon);border-radius:999px;padding:8px 14px;font-size:13px;margin:4px 6px 0 0}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.show{display:flex}
.sh{background:#0b2a29;border:1px solid #14574a;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h3{margin:0 0 12px;font-size:20px}.sh label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.sh input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #1d5a4a;background:#06191a;color:#fff;font:inherit;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips button{background:#0f4a40;color:var(--neon);border-radius:999px;padding:8px 12px;font-size:13px}
.cta{width:100%;margin-top:18px;padding:15px;border-radius:999px;background:var(--neon);color:#042;font-weight:700;font-size:16px}
.cta.alt{background:var(--pill);color:var(--neon);border:1px solid #1d5a4a;margin-top:10px}.cta.dng{background:#3a1220;color:#ff7b95;margin-top:10px}
.err{color:#ff7b95;font-size:13px;margin-top:8px;min-height:16px}
#ptr{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#0f4a40;color:var(--neon);display:grid;place-items:center;z-index:60;transform:translateY(-120px);box-shadow:0 4px 14px #0006}#ptr svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4}#ptr.ld svg{animation:sp .8s linear infinite}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:#e9ffe3;color:#063;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:99;transition:.3s;max-width:90%;text-align:center;box-shadow:0 6px 20px #0006}#toast.show{transform:translate(-50%,0)}
.disc{font-size:11px;color:var(--mut);text-align:center;padding:18px 24px 0;line-height:1.5}
</style></head>
<body><div id="app"></div><div class="ov" id="ov"><div class="sh" id="sh"></div></div><div id="ptr">${I_REFRESH}</div><div id="toast"></div>
<script>
const DAY=864e5,INIT=503075186;
const I={
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
 bell:'<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg>',
 user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
 eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeoff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9 9 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.7M6.6 6.6C3.7 8.4 2 12 2 12s4 7 10 7c1.5 0 2.8-.4 4-1"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/></svg>',
 out:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 8v8m0 0-3-3m3 3 3-3"/></svg>',
 trade:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5"/></svg>',
 swap:'<svg viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></svg>',
 hist:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>',
 ref:'<svg viewBox="0 0 24 24"><circle cx="7" cy="6" r="3"/><circle cx="17" cy="18" r="3"/><path d="M7 9v4a3 3 0 0 0 3 3h4"/></svg>',
 gift:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/></svg>',
 home:'<svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>',
 wallet:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 6V4H6M17 13h2"/></svg>',
 refresh:'<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8m0-5v5h-5"/></svg>'};
const COINS=[['BTC','Bitcoin',1488623722,-.12,'#f7931a'],['USDT','Tether USDT',17933,-.2,'#26a17b'],['ETH','Ethereum',52480000,.8,'#627eea'],['BNB','BNB',10250000,.35,'#f3ba2f'],['SOL','Solana',2890000,1.4,'#9945ff'],['XRP','XRP',38200,-.6,'#2b2f36'],['DOGE','Dogecoin',2650,2.1,'#c2a633']];
const def=()=>({v:2,bal:INIT,modal:210744873,profit:128975861,rate:.5,last:Date.now(),tx:[{t:Date.now(),type:'Saldo Awal',amt:INIT,bal:INIT,note:'Saldo awal'}],fav:{BTC:1},hide:0});
let S,tab='home',sub='all',q='';
try{S=JSON.parse(localStorage.getItem('floqlarp')||'null')}catch(e){}
{const o=S;S=Object.assign(def(),o||{});if(o&&!o.v){S.v=2;S.modal=210744873;S.profit=128975861;S.tx.forEach(x=>{x.note=(x.note||'').replace(/ virtual/g,'')});save()}}
const save=()=>{try{localStorage.setItem('floqlarp',JSON.stringify(S))}catch(e){}};
const R=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const $=s=>document.querySelector(s);
const D=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function log(type,amt,note){S.tx.unshift({t:Date.now(),type,amt,bal:S.bal,note});S.tx=S.tx.slice(0,500)}
function accrue(){let n=Math.floor((Date.now()-S.last)/DAY),c=0;if(n<1)return 0;if(n>365){n=365;S.last=Date.now()-n*DAY}
 for(let i=0;i<n;i++){const g=Math.round(S.bal*S.rate/100);S.bal+=g;S.profit+=g;S.last+=DAY;c++;S.tx.unshift({t:S.last,type:'Keuntungan Harian',amt:g,bal:S.bal,note:'Bunga majemuk '+S.rate+'%'})}
 S.tx=S.tx.slice(0,500);save();return c}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('show')}
function closeS(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeS()});
function cdText(){const ms=Math.max(0,S.last+DAY-Date.now()),s=Math.floor(ms/1e3);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function pf(){const p=S.profit,pc=S.modal?p/S.modal*100:0;return {p,pc}}
function txRows(a){return a.length?a.map(x=>`<div class="tx"><div><b>${x.type}</b><small>${D(x.t)} · ${x.note||''}</small></div><div class="a ${x.amt>=0?'pos':'neg'}">${x.amt>=0?'+':'−'}${R(Math.abs(x.amt))}<small>Saldo ${R(x.bal)}</small></div></div>`).join(''):'<div class="empty">Belum ada transaksi</div>'}
function head(){const {p,pc}=pf();return `<div class="top"><div class="logo"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M4 6h20M8 13h20M4 20h14M10 27h6" stroke="#5cff3c" stroke-width="4" stroke-linecap="round"/></svg>FLOQ</div>
<div class="ic"><button data-a="search">${I.search}</button><button data-a="bell">${I.bell}<span class="dot"></span></button><button data-a="admin">${I.user}</button></div></div>`}
function home(){const {p,pc}=pf(),h=S.hide;
 const list=COINS.filter(c=>sub==='all'||S.fav[c[0]]);
 return head()+`<div class="tot"><div class="l">Nilai Total Aset</div><div class="v"><b>${h?'Rp••••••••':R(S.bal)}</b><button data-a="eye" style="color:#fff;padding:6px">${h?I.eyeoff:I.eye}</button></div>
 <div class="pf ${p<0?'neg':''}">${p<0?'↘':'↗'} ${h?'Rp•••••':R(Math.abs(p))} (${pc.toFixed(1).replace('.',',')}%)</div></div>
 
 <div class="row2"><button class="big" data-a="topup">${I.plus}Isi Saldo</button><button class="big" data-a="wd">${I.out}Penarikan</button></div>
 <div class="quick"><button data-a="trade"><i>${I.trade}</i>Trade</button><button data-a="transfer"><i>${I.swap}</i>Transfer</button><button data-a="hist"><i>${I.hist}</i>Riwayat</button><button data-a="ref"><i>${I.ref}</i>Referal</button><button data-a="reward"><i>${I.gift}</i>Reward</button></div>
 ${wo()}
 <div class="sheetw"><div class="tabs"><button class="${sub==='all'?'on':''}" data-a="sub" data-v="all">Jelajah</button><button class="${sub==='fav'?'on':''}" data-a="sub" data-v="fav">Favorit</button></div>${coins(list)}</div>
 <div class="disc">FLOQ LARP adalah aplikasi roleplay fiktif. Bukan layanan keuangan resmi, tidak terafiliasi dengan FLOQ/ICEX, dan semua saldo hanyalah angka simulasi.</div>`}
function coins(l){return l.length?l.map(c=>`<div class="coin"><div class="cc" style="background:${c[4]}">${c[0].slice(0,3)}</div><div class="nm"><b>${c[0]}</b><span>${c[1]}</span></div><div class="pr"><b>${R(c[2])}</b><span class="chg ${c[3]<0?'dn':'up'}">${c[3]<0?'↘':'↗'} ${String(c[3]).replace('.',',')}%</span></div><button class="star ${S.fav[c[0]]?'on':''}" data-a="fav" data-v="${c[0]}">★</button></div>`).join(''):'<div class="empty">Belum ada favorit. Ketuk ★ pada aset.</div>'}
const PROMOS=[
{c:'Deposit',t:'Top-up min. Rp350.000 dapat cashback hingga',n:'20',u:'ribu poin',d:'s/d 9 November',k:['Cashback','Rp20.000'],i:'💰'},
{c:'Trading',t:'Trade perdana lebih hemat, diskon biaya hingga',n:'50',u:'%',d:'s/d 30 November',k:['Diskon','Biaya'],i:'📈'},
{c:'Deposit',t:'Top-up pertama min. Rp100.000 dapat bonus hingga',n:'5',u:'ribu poin',d:'s/d 15 November',k:['Bonus','Rp5.000'],i:'🎁'},
{c:'Informasi',t:'Jaga akunmu, jangan bagikan kode OTP kepada siapa pun',n:'OTP',u:'rahasia',d:'Info keamanan',k:['Tips','Aman'],i:'🔒'}];
let wc='Semua';
function wo(){const l=PROMOS.map((p,i)=>({p,i})).filter(x=>wc==='Semua'||x.p.c===wc);
 return `<div class="wo"><div class="wh"><b>What’s On</b><button data-a="woall">Lihat Semua</button></div><div class="chs">${['Semua','Trading','Deposit','Informasi'].map(c=>`<button class="${wc===c?'on':''}" data-a="wochip" data-v="${c}">${c}</button>`).join('')}</div><div class="car" id="car">${l.map(x=>`<div class="sl" data-a="promo" data-v="${x.i}"><div class="br"><svg width="18" height="18" viewBox="0 0 34 34"><path d="M4 6h20M8 13h20M4 20h14M10 27h6" stroke="#a6f08a" stroke-width="4" stroke-linecap="round"/></svg>FLOQ</div><h4>${x.p.t}</h4><div class="bg"><span>${x.p.n}</span><small>${x.p.u}</small></div><div class="dt">${x.p.d}</div><div class="tk"><small>${x.p.k[0]}</small>${x.p.k[1]}</div><div class="gm">${x.p.i}</div></div>`).join('')}</div><div class="dots" id="dots">${l.map((x,j)=>`<button class="${j?'':'on'}" data-a="dot" data-v="${j}"></button>`).join('')}</div></div>`}
function disc(){const l=COINS.filter(c=>(c[0]+c[1]).toLowerCase().includes(q.toLowerCase()));return head()+`<div class="pg"><h2>Discover</h2><div class="mut">Harga ilustrasi, bukan data pasar nyata.</div></div><div class="sheetw" style="margin-top:0"><input class="srch" id="q" placeholder="Cari aset…" value="${q}">${coins(l)}</div>`}
function trd(){const r=S.rate/100,pr=[7,30,90,180,365].map(d=>`<div class="tx"><div><b>${d} hari</b><small>Proyeksi bunga majemuk</small></div><div class="a pos">${R(S.bal*Math.pow(1+r,d))}<small>+${R(S.bal*(Math.pow(1+r,d)-1))}</small></div></div>`).join('');
 return head()+`<div class="pg"><h2>Trade</h2><div class="mut">Tidak ada trading sungguhan. Ini proyeksi saldo dengan ${String(S.rate).replace('.',',')}% per 24 jam.</div><div class="card">${pr}</div><button class="cta alt" data-a="accr">Lihat rincian keuntungan terbayar</button></div>`}
function wal(){const {p,pc}=pf();return head()+`<div class="pg"><h2>Dompet</h2><div class="card"><div class="mut">Saldo</div><div style="font-size:30px;font-weight:700">${R(S.bal)}</div><div class="mut" style="margin-top:6px">Untung: <span class="${p<0?'neg':'pos'}">${R(p)} (${pc.toFixed(1).replace('.',',')}%)</span></div>
 <div class="row2" style="padding:14px 0 0"><button class="big" data-a="topup">${I.plus}Isi</button><button class="big" data-a="wd">${I.out}Tarik</button></div></div>
 <h2 style="font-size:18px;margin-top:22px">Riwayat Transaksi</h2><div class="card" style="margin-top:8px">${txRows(S.tx.slice(0,30))}</div><button class="cta alt" data-a="hist">Lihat semua riwayat (${S.tx.length})</button></div>`}
function render(){const s=document.scrollingElement.scrollTop;const v={home,disc,trade:trd,wallet:wal}[tab]();
 const nb=[['home','Beranda',I.home],['disc','Discover',I.search],['trade','Trade',I.trade],['wallet','Dompet',I.wallet]];
 $('#app').innerHTML=v+`<nav class="nav">${nb.map(n=>`<button class="${tab===n[0]?'on':''}" data-a="tab" data-v="${n[0]}">${n[2]}${n[1]}</button>`).join('')}</nav>`;
 document.scrollingElement.scrollTop=s;const qi=$('#q');if(qi)qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
function amtSheet(kind){const t=kind==='topup'?'Isi Saldo':kind==='wd'?'Penarikan':'Transfer';
 sheet(`<h3>${t}</h3><div class="mut">Hanya mengubah angka di aplikasi roleplay ini.</div>${kind==='transfer'?'<label>Penerima (fiktif)</label><input id="to" placeholder="Nama teman roleplay">':''}<label>Jumlah (Rp)</label><input id="amt" inputmode="numeric" placeholder="0"><div class="chips">${[1e6,5e6,10e6,50e6].map(v=>`<button data-a="chip" data-v="${v}">${R(v)}</button>`).join('')}${kind!=='topup'?'<button data-a="chip" data-v="max">Maks</button>':''}</div><div class="err" id="er"></div><button class="cta" data-a="go" data-v="${kind}">Konfirmasi ${t}</button><button class="cta alt" data-a="close">Batal</button>`);
 const a=$('#amt');a.oninput=()=>{const n=a.value.replace(/\D/g,'');a.value=n?(+n).toLocaleString('id-ID'):''}}
const num=s=>+String(s||'').replace(/\D/g,'');
function doGo(k){const a=num($('#amt').value),er=$('#er');if(!a){er.textContent='Masukkan jumlah yang valid.';return}
 if(k==='topup'){S.bal+=a;log('Isi Saldo',a,'Top up')}
 else{if(a>S.bal){er.textContent='Saldo tidak cukup.';return}
  if(k==='wd'){S.bal-=a;log('Penarikan',-a,'Penarikan')}
  else{const to=($('#to').value||'').trim();if(!to){er.textContent='Isi nama penerima.';return}S.bal-=a;log('Transfer',-a,'Ke '+to+' (fiktif)')}}
 save();closeS();render();toast('Berhasil: '+R(a))}
function adminSheet(){sheet(`<h3>Menu Admin</h3><div class="mut">Atur simulasi roleplay.</div><label>Atur saldo (Rp)</label><input id="ab" inputmode="numeric" value="${Math.round(S.bal).toLocaleString('id-ID')}"><label>Keuntungan saat ini (Rp)</label><input id="ap" inputmode="numeric" value="${Math.round(S.profit).toLocaleString('id-ID')}"><label>Persentase keuntungan per 24 jam (%)</label><input id="ar" inputmode="decimal" value="${S.rate}">
 <div class="err" id="er"></div><button class="cta" data-a="asave">Simpan Pengaturan</button><button class="cta alt" data-a="aday">Simulasi +1 hari (tes bunga)</button><button class="cta dng" data-a="areset">Reset semua data</button><button class="cta alt" data-a="close">Tutup</button>`)
 const b=$('#ab');b.oninput=()=>{const n=b.value.replace(/\D/g,'');b.value=n?(+n).toLocaleString('id-ID'):''};const p2=$('#ap');p2.oninput=()=>{const n=p2.value.replace(/\D/g,'');p2.value=n?(+n).toLocaleString('id-ID'):''}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
 switch(a){
 case'tab':tab=v;render();scrollTo(0,0);break;
 case'sub':sub=v;render();break;
 case'fav':if(S.fav[v])delete S.fav[v];else S.fav[v]=1;save();render();break;
 case'eye':S.hide=S.hide?0:1;save();render();break;
 case'search':tab='disc';render();setTimeout(()=>{const i=$('#q');i&&i.focus()},50);break;
 case'bell':sheet(`<h3>Notifikasi</h3>${txRows(S.tx.slice(0,5))}<button class="cta alt" data-a="close">Tutup</button>`);$('.dot')&&$('.dot').remove();break;
 case'admin':adminSheet();break;
 case'refresh':doRefresh();break;
 case'topup':case'wd':amtSheet(a);break;
 case'transfer':amtSheet('transfer');break;
 case'chip':$('#amt').value=(v==='max'?Math.round(S.bal):+v).toLocaleString('id-ID');break;
 case'go':doGo(v);break;
 case'close':closeS();break;
 case'trade':tab='trade';render();scrollTo(0,0);break;
 case'hist':sheet(`<h3>Riwayat Transaksi</h3>${txRows(S.tx)}<button class="cta alt" data-a="close">Tutup</button>`);break;
 case'accr':sheet(`<h3>Keuntungan Harian</h3>${txRows(S.tx.filter(x=>x.type==='Keuntungan Harian'))}<button class="cta alt" data-a="close">Tutup</button>`);break;
 case'ref':{const code='LARP-'+(S.tx[S.tx.length-1].t%100000).toString(36).toUpperCase();try{navigator.clipboard.writeText(code)}catch(x){}sheet(`<h3>Referal (Fiktif)</h3><div class="mut">Kode roleplay kamu. Tidak ada bonus nyata maupun virtual.</div><div class="card" style="text-align:center;font-size:26px;font-weight:800;color:var(--neon)">${code}</div><button class="cta" data-a="close">Oke</button>`);break}
 case'reward':sheet(`<h3>Reward</h3><div class="mut">Tidak ada bonus instan di FLOQ LARP. Saldo hanya bertambah lewat keuntungan ${String(S.rate).replace('.',',')}% tiap 24 jam, saat periode selesai.</div><div class="card"><div class="mut">Periode berikutnya dalam</div><div id="cd2" style="font-size:30px;font-weight:700;color:var(--neon)">${cdText()}</div></div><button class="cta" data-a="close">Mengerti</button>`);break;
 case'wochip':wc=v;render();break;
 case'woall':sheet(`<h3>Semua Promo</h3>${PROMOS.map((p,i)=>`<div class="tx" data-a="promo" data-v="${i}" style="cursor:pointer"><div><b>${p.t} ${p.n} ${p.u}</b><small>${p.c} · ${p.d}</small></div></div>`).join('')}<button class="cta alt" data-a="close">Tutup</button>`);break;
 case'promo':{const p=PROMOS[v];sheet(`<h3>${p.i} ${p.t} ${p.n} ${p.u}</h3><div class="mut">${p.c} · ${p.d}</div><div class="card mut">Promo ini hanya tampilan di aplikasi roleplay dan tidak mengubah saldo.</div><button class="cta" data-a="close">Mengerti</button>`);break}
 case'dot':{const c=$('#car');c.scrollTo({left:v*(c.children[0].offsetWidth+12),behavior:'smooth'});break}
 case'banner':toast('FLOQ LARP: aplikasi roleplay, bukan layanan keuangan resmi');break;
 case'asave':{const b=num($('#ab').value),pr=num($('#ap').value),r=parseFloat(String($('#ar').value).replace(',','.')),er=$('#er');if(!(r>=0&&r<=100)){er.textContent='Persentase harus 0–100.';return}
  const d=b-S.bal;if(d!==0){S.bal=b;log('Atur Admin',d,'Saldo diatur admin')}S.profit=pr;S.rate=r;save();closeS();render();toast('Pengaturan disimpan');break}
 case'aday':S.last-=DAY;{const c=accrue();render();toast(c?'+1 periode keuntungan diterapkan':'Tidak ada perubahan')}closeS();break;
 case'areset':if(el.dataset.c){S=def();save();closeS();render();toast('Data direset')}else{el.dataset.c=1;el.textContent='Ketuk lagi untuk konfirmasi reset'}break;
 }});
accrue();render();
$('#ptr').innerHTML=I.refresh;
let ty=0,pd=0,pl=false;
function doRefresh(){const p=$('#ptr');p.classList.add('ld');p.style.transition='transform .2s';p.style.transform='translateY(60px)';const c=accrue();setTimeout(()=>{render();p.classList.remove('ld');p.style.transform='translateY(-120px)';toast(c?'Saldo diperbarui: '+c+' periode keuntungan masuk':'Saldo diperbarui')},700)}
addEventListener('touchstart',e=>{pd=0;pl=document.scrollingElement.scrollTop<=0&&!$('#ov.show')&&e.touches.length===1;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(!pl)return;const d=e.touches[0].clientY-ty,p=$('#ptr');if(d>0&&document.scrollingElement.scrollTop<=0){pd=Math.min(d*.5,90);p.style.transition='none';p.style.transform='translateY('+(pd-20)+'px) rotate('+(pd*4)+'deg)'}else{pd=0;p.style.transition='transform .2s';p.style.transform='translateY(-120px)'}},{passive:true});
addEventListener('touchend',()=>{if(!pl)return;pl=false;if(pd>=60)doRefresh();else{const p=$('#ptr');p.style.transition='transform .2s';p.style.transform='translateY(-120px)'}pd=0});
document.addEventListener('scroll',e=>{const c=e.target;if(!c||c.id!=='car')return;const i=Math.round(c.scrollLeft/(c.children[0].offsetWidth+12));document.querySelectorAll('#dots button').forEach((d,j)=>d.classList.toggle('on',j===i))},true);
setInterval(()=>{const c=$('#cd'),c2=$('#cd2');if(Date.now()-S.last>=DAY){if(accrue()){render();toast('Keuntungan harian masuk')}}else{if(c)c.textContent=cdText();if(c2)c2.textContent=cdText()}},1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
